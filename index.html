<style>
/* ===== ZINE CANVAS SYSTEM ===== */
:root {
  --paper: #F3EDE4;
  --paper-warm: #EDE5D8;
  --ink: #1E1812;
  --ink-soft: #5A4F42;
  --ink-faint: #9A8E7E;
  --accent: #9B2335;
  --accent-deep: #6B1522;
  --gold: #B8956A;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html {
  scroll-behavior: smooth;
  background: var(--paper);
}

body {
  font-family: 'Noto Serif SC', 'Crimson Text', Georgia, serif;
  background: var(--paper);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.9;
  letter-spacing: 0.04em;
}

/* ===== PAPER TEXTURE ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
  opacity: 0.6;
}

/* ===== LOADING ===== */
#loader {
  position: fixed; inset: 0;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 1.5s cubic-bezier(0.22,1,0.36,1), visibility 1.5s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-paper {
  width: 120px; height: 160px;
  background: var(--paper-warm);
  border: 1px solid rgba(30,24,18,0.08);
  position: relative;
  animation: loaderFade 2s ease 0.3s both;
}
.loader-paper::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 3px; right: 3px;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px, transparent 2px,
    rgba(30,24,18,0.06) 2px, rgba(30,24,18,0.06) 4px
  );
}
.loader-text {
  margin-top: 32px;
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  color: var(--ink-faint);
  animation: loaderFade 2s ease 0.8s both;
}
@keyframes loaderFade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== PAGE SYSTEM ===== */
.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 28px;
  overflow: hidden;
}

/* ===== TYPOGRAPHY ===== */
.type-display {
  font-weight: 300;
  font-size: clamp(1.6rem, 6vw, 2.8rem);
  letter-spacing: 0.25em;
  line-height: 1.4;
}
.type-title {
  font-weight: 400;
  font-size: clamp(1rem, 3.5vw, 1.4rem);
  letter-spacing: 0.2em;
  line-height: 1.6;
}
.type-body {
  font-weight: 300;
  font-size: clamp(0.8rem, 2.2vw, 0.95rem);
  letter-spacing: 0.08em;
  line-height: 2.4;
  color: var(--ink-soft);
}
.type-caption {
  font-family: 'Crimson Text', Georgia, serif;
  font-weight: 400;
  font-size: clamp(0.65rem, 1.8vw, 0.75rem);
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.type-number {
  font-family: 'Crimson Text', Georgia, serif;
  font-weight: 600;
  font-size: clamp(3rem, 10vw, 5rem);
  line-height: 1;
  color: var(--accent);
  opacity: 0.25;
}
.type-micro {
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--ink-faint);
}

/* ===== TORN EDGE ===== */
.torn-container {
  position: relative;
  display: inline-block;
}
.torn-img {
  display: block;
  width: 100%;
  height: auto;
  filter: none;
}

/* ===== DIVIDERS ===== */
.rule-short {

  height: 1px;
  background: var(--ink);
  opacity: 0.15;
  margin: 24px auto;
}
.rule-accent {

  height: 2px;

}

/* ===== COVER PAGE ===== */

}
.cover-page .reveal {

}
.cover-photo {

  height: 100vh;
  height: 100svh;
  margin: 0;
}
.cover-photo .torn-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 22%;
}

/* ===== INVITATION PAGE ===== */
.invite-page {
  padding: 80px 32px;

  margin: 0 auto;
}
.invite-quote {

.pair-grid {

}
.pair-item {

.btn-map:hover { background: var(--accent); }

/* ===== COUNTDOWN ===== */
.timer {

.timer-unit {

/* ===== ENDING ===== */
.ending-heart {
  display: inline-block;
  animation: heartbeat 2s ease-in-out infinite;
  color: var(--accent);
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  20% { transform: scale(1.1); }
  40% { transform: scale(1); }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  opacity: 0;
  transform: translateY(24px);

.reveal.visible {

/* ===== MUSIC ===== */
.music-btn {

.music-btn:hover { background: rgba(243,237,228,1); }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== PETALS ===== */
.petal {

  opacity: 0.3;

@keyframes fall {

  50% { transform: translateY(50vh) rotate(360deg) translateX(15px); }
  100% { transform: translateY(110vh) rotate(720deg) translateX(-5px); opacity: 0; }

/* ===== SPACING UTILS ===== */

/* ===== MOBILE FINE TUNE ===== */

  .pair-item { max-width: 224px; }
}

<script>
// Loader
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 1200);
});

// CDN fallback: cascade through jsDelivr mirrors, then same-origin (GitHub Pages)
const IMG_HOSTS = [
  'https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@main/',
  'https://fastly.jsdelivr.net/gh/lzz66/wedding-invitation2@main/',
  'https://gcore.jsdelivr.net/gh/lzz66/wedding-invitation2@main/',
  'https://testingcf.jsdelivr.net/gh/lzz66/wedding-invitation2@main/',
  ''
];
function imgPath(src) {
  const m = src.match(/artistic_photos\/[^?"]+/);
  return m ? m[0] : null;
}
function nextHost(t) {
  const p = imgPath(t.src);
  if (!p) return;
  const q = (t.src.match(/\?v=\d+/) || [''])[0];
  const i = parseInt(t.dataset.fbk || '0', 10) + 1;
  if (i >= IMG_HOSTS.length) return;
  t.dataset.fbk = String(i);
  const base = IMG_HOSTS[i];
  t.src = base ? base + p + q : p + q;
}
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG') nextHost(t);
}, true);
// Watchdog: visible images still unloaded after 8s switch to next host
setInterval(() => {
  document.querySelectorAll('img[src*="jsdelivr.net"]').forEach(t => {
    if (t.complete && t.naturalWidth > 0) return;
    const r = t.getBoundingClientRect();
    if (r.top < innerHeight * 2 && r.bottom > -innerHeight) nextHost(t);
  });
}, 8000);

// Music
let musicPlayed = false;
// BGM source fallback: CDN first (fast in China), same-origin if it errors or stalls
(function () {
  const a = document.getElementById('bgm');
  let swapped = false;
  function toLocal() {
    if (swapped) return;
    swapped = true;
    const wasPlaying = musicPlayed && !a.paused;
    a.src = 'bgm.mp3';
    a.load();
    if (wasPlaying) a.play().catch(() => {});
  }
  a.addEventListener('error', toLocal);
  const srcEl = a.querySelector('source');
  if (srcEl) srcEl.addEventListener('error', toLocal);
  // if not enough data to play within 6s of page load, switch source
  setTimeout(() => { if (a.readyState < 3) toLocal(); }, 6000);
})();
function toggleMusic() {
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  if (audio.paused) {
    audio.play().catch(() => {});
    btn.classList.remove('paused');
  } else {
    audio.pause();
    btn.classList.add('paused');
  }
}
function autoPlay() {
  const audio = document.getElementById('bgm');
  if (!musicPlayed) {
    audio.play().then(() => { musicPlayed = true; }).catch(() => {});
  }
}
document.addEventListener('touchstart', autoPlay, { once: true });
document.addEventListener('click', autoPlay, { once: true });

// Petals
function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'petal';
  petal.style.left = Math.random() * 100 + 'vw';
  petal.style.animationDuration = (Math.random() * 4 + 7) + 's';
  petal.style.opacity = Math.random() * 0.25 + 0.15;
  const scale = Math.random() * 0.4 + 0.6;
  petal.style.transform = `scale(${scale})`;
  document.getElementById('petals').appendChild(petal);
  setTimeout(() => petal.remove(), 12000);
}
setInterval(createPetal, 900);

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Countdown
function updateCountdown() {
  const weddingDate = new Date('2026-10-03T12:00:00');
  const now = new Date();
  const diff = weddingDate - now;
  if (diff > 0) {
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById('days').textContent = String(d).padStart(2, '0');
    document.getElementById('hours').textContent = String(h).padStart(2, '0');
    document.getElementById('minutes').textContent = String(m).padStart(2, '0');
    document.getElementById('seconds').textContent = String(s).padStart(2, '0');
  }
}
setInterval(updateCountdown, 1000);
updateCountdown();

document.title = '程谦&刘之壮的婚礼邀请';
</script>
