<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>程谦&刘之壮的回门宴邀请</title>
<meta property="og:title" content="程谦&刘之壮的回门宴邀请">
<meta property="og:description" content="2026.10.03 · 愿有岁月可回首，且以深情共白头">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/cover.jpg?v=11">
<meta property="og:image:width" content="768">
<meta property="og:image:height" content="1280">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lzz66.github.io/wedding-invitation2/">
<meta name="twitter:card" content="summary_large_image">
<link rel="dns-prefetch" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="image" href="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/artistic_photos/art_cover.jpg?v=11">
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ===== ZINE CANVAS SYSTEM ===== */
:root {
  --paper: #F3EDE4;
  --paper-warm: #EDE5D8;
  --ink: #1E1812;
  --ink-soft: #5A4F42;
  --ink-faint: #9A8E7E;
  --accent: #9B2335;
  --accent-deep: #6B1522;
  --gold: #B8956A;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html {
  scroll-behavior: smooth;
  background: var(--paper);
}

body {
  font-family: 'Noto Serif SC', 'Crimson Text', Georgia, serif;
  background: var(--paper);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.9;
  letter-spacing: 0.04em;
}

/* ===== PAPER TEXTURE ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
  opacity: 0.6;
}

/* ===== LOADING ===== */
#loader {
  position: fixed; inset: 0;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 1.5s cubic-bezier(0.22,1,0.36,1), visibility 1.5s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-paper {
  width: 120px; height: 160px;
  background: var(--paper-warm);
  border: 1px solid rgba(30,24,18,0.08);
  position: relative;
  animation: loaderFade 2s ease 0.3s both;
}
.loader-paper::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 3px; right: 3px;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px, transparent 2px,
    rgba(30,24,18,0.06) 2px, rgba(30,24,18,0.06) 4px
  );
}
.loader-text {
  margin-top: 32px;
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  color: var(--ink-faint);
  animation: loaderFade 2s ease 0.8s both;
}
@keyframes loaderFade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== ENVELOPE INTRO ===== */
body.intro-lock { overflow: hidden; height: 100vh; }

#env-intro {
  position: fixed; inset: 0;
  z-index: 10000;
  perspective: 1800px;
}
#env-intro .door {
  position: absolute; top: 0; bottom: 0; width: 50.2%;
  background: var(--paper-warm);
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  transition: transform 1.7s cubic-bezier(0.65, 0, 0.2, 1) 0.35s;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
#env-intro .door-l {
  left: 0;
  transform-origin: right center;
  box-shadow: inset -14px 0 24px -14px rgba(30,24,18,0.45);
  border-right: 1px solid rgba(184,149,106,0.55);
}
#env-intro .door-r {
  right: 0;
  transform-origin: left center;
  box-shadow: inset 14px 0 24px -14px rgba(30,24,18,0.45);
  border-left: 1px solid rgba(184,149,106,0.55);
}
#env-intro.book-open .door-l { transform: rotateY(-158deg); }
#env-intro.book-open .door-r { transform: rotateY(158deg); }
#env-intro.fade-out { opacity: 0; visibility: hidden; transition: opacity 0.8s ease, visibility 0.8s; pointer-events: none; }

.env-stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.55s ease, transform 0.55s ease;
}
#env-intro.book-open .env-stage { opacity: 0; transform: scale(1.12); }

.envelope {
  position: relative;
  width: min(78vw, 330px);
  aspect-ratio: 330 / 218;
  perspective: 900px;
  animation: envIn 1s cubic-bezier(0.22,1,0.36,1) 0.25s both;
  filter: drop-shadow(0 18px 28px rgba(30,24,18,0.22));
}
@keyframes envIn {
  from { opacity: 0; transform: translateY(26px) scale(0.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.env-body {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #F7F1E6 0%, #EFE6D5 100%);
  border: 1px solid rgba(30,24,18,0.12);
  border-radius: 4px;
}
.env-letter {
  position: absolute;
  left: 5%; right: 5%; top: 5%; height: 90%;
  background: #FBF7EF;
  border: 1px solid rgba(30,24,18,0.10);
  border-radius: 3px;
  box-shadow: 0 4px 14px rgba(30,24,18,0.14);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  z-index: 2;
  transition: transform 1.05s cubic-bezier(0.22,1,0.36,1) 0.15s;
}
#env-intro.letter-out .env-letter { transform: translateY(-62%); }
.env-letter-names {
  font-size: clamp(17px, 5vw, 21px);
  letter-spacing: 0.14em;
  color: var(--ink);
  font-weight: 600;
}
.env-letter-sub {
  font-size: 11px;
  letter-spacing: 0.42em;
  color: var(--ink-faint);
  text-indent: 0.42em;
}
.env-letter-date {
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--ink-soft);
}
.env-pocket {
  position: absolute; inset: 0;
  background: linear-gradient(200deg, #F2EADA 0%, #EAE0CD 100%);
  clip-path: polygon(0 0, 0 100%, 100% 100%, 100% 0, 50% 46%);
  border-radius: 4px;
  z-index: 3;
}
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 52%;
  background: linear-gradient(180deg, #EFE6D3 0%, #E6DBC4 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  z-index: 4;
  transition: transform 0.95s cubic-bezier(0.55, 0, 0.35, 1), z-index 0s 0.45s;
  border-radius: 4px 4px 0 0;
}
#env-intro.flap-open .env-flap { transform: rotateX(-178deg); z-index: 1; }
.wax {
  position: absolute;
  left: 50%; top: calc(52% - 22px);
  transform: translateX(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B03A4C 0%, var(--accent) 45%, var(--accent-deep) 100%);
  color: #F6E9DF;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  z-index: 5;
  box-shadow: 0 3px 8px rgba(107,21,34,0.45), inset 0 0 0 3px rgba(246,233,223,0.18);
  transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
}
#env-intro.flap-open .wax { opacity: 0; transform: translateX(-50%) scale(0.6); }
.env-hint {
  margin-top: 42px;
  font-size: 11px;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: var(--ink-faint);
  animation: envHint 2.4s ease-in-out 1.4s infinite;
}
@keyframes envHint {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.9; }
}
#env-intro.book-open .env-hint { animation: none; opacity: 0; transition: opacity 0.3s; }

/* ===== PAGE SYSTEM ===== */
.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 28px;
  overflow: hidden;
}

/* ===== TYPOGRAPHY ===== */
.type-display {
  font-weight: 300;
  font-size: clamp(1.6rem, 6vw, 2.8rem);
  letter-spacing: 0.25em;
  line-height: 1.4;
}
.type-title {
  font-weight: 400;
  font-size: clamp(1rem, 3.5vw, 1.4rem);
  letter-spacing: 0.2em;
  line-height: 1.6;
}
.type-body {
  font-weight: 300;
  font-size: clamp(0.8rem, 2.2vw, 0.95rem);
  letter-spacing: 0.08em;
  line-height: 2.4;
  color: var(--ink-soft);
}
.type-caption {
  font-family: 'Crimson Text', Georgia, serif;
  font-weight: 400;
  font-size: clamp(0.65rem, 1.8vw, 0.75rem);
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.type-number {
  font-family: 'Crimson Text', Georgia, serif;
  font-weight: 600;
  font-size: clamp(3rem, 10vw, 5rem);
  line-height: 1;
  color: var(--accent);
  opacity: 0.25;
}
.type-micro {
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--ink-faint);
}

/* ===== TORN EDGE ===== */
.torn-container {
  position: relative;
  display: inline-block;
}
.torn-img {
  display: block;
  width: 100%;
  height: auto;
  filter: none;
}

/* ===== DIVIDERS ===== */
.rule-short {
  width: 32px;
  height: 1px;
  background: var(--ink);
  opacity: 0.15;
  margin: 24px auto;
}
.rule-accent {
  width: 24px;
  height: 2px;
  background: var(--accent);
  opacity: 0.6;
  margin: 20px auto;
}

/* ===== COVER PAGE ===== */
.cover-page {
  padding: 0;
}
.cover-page .reveal {
  width: 100%;
  height: 100%;
}
.cover-photo {
  width: 100%;
  max-width: none;
  height: 100vh;
  height: 100svh;
  margin: 0;
}
.cover-photo .torn-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 22%;
}

/* ===== INVITATION PAGE ===== */
.invite-page {
  padding: 80px 32px;
  max-width: 380px;
  margin: 0 auto;
}
.invite-quote {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 4rem;
  line-height: 0.3;
  color: var(--accent);
  opacity: 0.2;
  display: block;
  margin-bottom: 8px;
}


/* ===== PAIR GRID ===== */
.pair-grid {
  display: flex;
  flex-direction: column;
  gap: 28px;
  justify-content: center;
  align-items: center;
  width: 100%;
}
.pair-item {
  flex: 1 1 0;
  min-width: 0;
  width: 100%;
  max-width: none;
  text-align: center;
  margin: 0;
}
.pair-item .scene-photo {
  width: 100%;
  max-width: 100%;
  margin: 0;
}
.pair-item .torn-img {
  width: 100%;
  height: auto;
  aspect-ratio: 3/5;
  object-fit: cover;
}
.pair-cap {
  margin-top: 16px;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--ink-faint);
}

/* ===== SCENE PAGE ===== */
.scene-page {
  padding: 28px 8px;
  max-width: 480px;
  margin: 0 -22px;
}
.scene-photo {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  position: relative;
}
.scene-photo .torn-img {
  width: 100%;
  height: auto;
}
.scene-meta {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-top: 24px;
  padding-left: 4px;
}
.scene-label {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
  writing-mode: vertical-rl;
  text-orientation: mixed;
  padding-top: 8px;
}

/* ===== INFO PAGE ===== */
.info-grid {
  width: 100%;
  max-width: 340px;
  margin: 0 auto;
}
.info-row {
  padding: 32px 0;
  border-bottom: 1px solid rgba(30,24,18,0.06);
  text-align: center;
}
.info-row:last-child { border-bottom: none; }
.info-row h3 {
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  color: var(--ink-faint);
  margin-bottom: 12px;
  font-weight: 400;
}
.info-row .value {
  font-weight: 400;
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  letter-spacing: 0.15em;
  color: var(--ink);
  line-height: 1.6;
}
.info-row .sub {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 6px;
  letter-spacing: 0.05em;
}
.btn-map {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
  padding: 12px 32px;
  background: var(--ink);
  color: var(--paper);
  text-decoration: none;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  transition: all 0.3s ease;
}
.btn-map:hover { background: var(--accent); }

/* ===== COUNTDOWN ===== */
.timer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 12px;
  margin-top: 32px;
}
.timer-unit {
  text-align: center;
  min-width: 56px;
}
.timer-unit .num {
  font-family: 'Crimson Text', Georgia, serif;
  font-weight: 600;
  font-size: clamp(2.2rem, 7vw, 3.5rem);
  line-height: 1;
  color: var(--accent);
}
.timer-unit .label {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
  margin-top: 8px;
}
.timer-sep {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 1.5rem;
  color: var(--ink-faint);
  opacity: 0.4;
  line-height: 1.8;
}

/* ===== ENDING ===== */
.ending-heart {
  display: inline-block;
  animation: heartbeat 2s ease-in-out infinite;
  color: var(--accent);
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  20% { transform: scale(1.1); }
  40% { transform: scale(1); }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: all 1.2s cubic-bezier(0.22,1,0.36,1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ===== MUSIC ===== */
.music-btn {
  position: fixed;
  top: 20px; right: 20px;
  width: 40px; height: 40px;
  background: rgba(243,237,228,0.8);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
  border: 1px solid rgba(30,24,18,0.06);
  animation: rotate 8s linear infinite;
  transition: background 0.3s;
}
.music-btn.paused { animation-play-state: paused; }
.music-btn:hover { background: rgba(243,237,228,1); }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== PETALS ===== */
.petal {
  position: fixed; top: -10%;
  width: 8px; height: 8px;
  background: linear-gradient(135deg, #E8C4C4 0%, #D4A5A5 100%);
  border-radius: 50% 0 50% 50%;
  opacity: 0.3;
  animation: fall linear infinite;
  z-index: 50;
  pointer-events: none;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.3; }
  50% { transform: translateY(50vh) rotate(360deg) translateX(15px); }
  100% { transform: translateY(110vh) rotate(720deg) translateX(-5px); opacity: 0; }
}

/* ===== SPACING UTILS ===== */
.gap-sm { height: 16px; }
.gap-md { height: 32px; }
.gap-lg { height: 64px; }
.gap-xl { height: 100px; }

/* ===== MOBILE FINE TUNE ===== */
@media (min-width: 768px) {
  .page { padding: 64px 40px; }
  .scene-page { max-width: 480px; margin: 0 auto; }
  .pair-grid { flex-direction: row; gap: 18px; align-items: flex-start; }
  .pair-item { max-width: 224px; }
}
</style>
</head>
<body>

<audio id="bgm" loop preload="auto">
  <source src="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/bgm.mp3?v=11" type="audio/mpeg">
</audio>
<div class="music-btn" id="musicBtn" onclick="toggleMusic()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A8E7E" stroke-width="2" stroke-linecap="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
</div>
<div id="petals"></div>

<!-- LOADING -->
<div id="loader">
  <div class="loader-paper"></div>
  <div class="loader-text">请柬</div>
</div>

<!-- ENVELOPE INTRO -->
<div id="env-intro" aria-hidden="true">
  <div class="door door-l"></div>
  <div class="door door-r"></div>
  <div class="env-stage">
    <div class="envelope">
      <div class="env-body"></div>
      <div class="env-letter">
        <div class="env-letter-names">程谦 &amp; 刘之壮</div>
        <div class="env-letter-sub">回门宴请柬</div>
        <div class="env-letter-date">2026.10.03</div>
      </div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="wax">囍</div>
    </div>
    <div class="env-hint">正在为您启封</div>
  </div>
</div>

<!-- ===== PAGE 1: COVER (full-screen poster with names & date baked in) ===== -->
<section class="page cover-page">
  <div class="cover-photo torn-container reveal">
    <img src="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/artistic_photos/art_cover.jpg?v=11" class="torn-img" fetchpriority="high" decoding="async" alt="程谦与刘之壮的回门宴邀请封面">
  </div>
</section>

<!-- ===== OPENING: 园林窗景合并海报 (below cover, above invitation words) ===== -->
<section class="page">
  <div class="scene-page reveal">
    <figure style="margin:0;text-align:center;">
      <div class="scene-photo torn-container" style="max-width:none;">
        <img src="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/artistic_photos/art_s78.jpg?v=11" class="torn-img" loading="lazy" decoding="async" alt="隔窗相望">
      </div>
      <figcaption class="pair-cap">隔窗相望</figcaption>
    </figure>
  </div>
</section>

<!-- ===== PAGE 2: INVITATION ===== -->
<section class="page">
  <div class="invite-page reveal">
    <span class="invite-quote">"</span>
    <p class="type-title" style="margin-bottom:32px;">
      从相识到相知<br>
      从相爱到相守
    </p>
    <div class="rule-accent"></div>
    <p class="type-body">
      我们决定携手一生<br><br>
      在这美好的季节里<br>
      诚挚邀请您<br>
      见证我们人生中最重要的时刻
    </p>
    <figure style="margin:28px -26px 0;text-align:center;">
      <div class="scene-photo torn-container" style="max-width:none;">
        <img src="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/artistic_photos/art_s3.jpg?v=10" class="torn-img" loading="lazy" decoding="async" alt="执手同行">
      </div>
      <figcaption class="pair-cap">执手同行</figcaption>
    </figure>
    <div class="gap-lg"></div>
    <div class="type-caption">Homecoming Banquet</div>
  </div>
</section>

<!-- ===== MEMORIES 1 ===== -->
<section class="page">
  <div class="scene-page reveal">
    <div class="pair-grid">
      <figure class="pair-item">
        <div class="scene-photo torn-container">
          <img src="https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/artistic_photos/art_s1.jpg?v=10" class="torn-img" loading="lazy" decoding="async" alt="锦绣良缘">
        </div>
        <figcaption class="pair-cap">壹 · 锦绣良缘</figcaption>

<script>
// Loader
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 1200);
});

// Envelope intro: flap opens -> letter rises -> book doors swing open -> reveal
(function () {
  var intro = document.getElementById('env-intro');
  if (!intro) return;
  document.body.classList.add('intro-lock');
  var done = false;
  function finish() {
    if (done) return;
    done = true;
    intro.classList.add('book-open');
    setTimeout(function () {
      intro.classList.add('fade-out');
      document.body.classList.remove('intro-lock');
      setTimeout(function () { intro.remove(); }, 900);
    }, 2100);
  }
  function start() {
    setTimeout(function () { intro.classList.add('flap-open'); }, 900);
    setTimeout(function () { intro.classList.add('letter-out'); }, 2100);
    setTimeout(finish, 3400);
  }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    finish();
  } else if (document.readyState === 'complete') {
    setTimeout(start, 300);
  } else {
    window.addEventListener('load', function () { setTimeout(start, 300); });
  }
  intro.addEventListener('click', finish);
})();

// CDN fallback: cascade through jsDelivr mirrors, then same-origin (GitHub Pages)
const IMG_HOSTS = [
  'https://cdn.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/',
  'https://fastly.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/',
  'https://gcore.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/',
  'https://testingcf.jsdelivr.net/gh/lzz66/wedding-invitation2@c40c3b6/',
  ''
];
function imgPath(src) {
  const m = src.match(/artistic_photos\/[^?"]+/);
  return m ? m[0] : null;
}
function nextHost(t) {
  const p = imgPath(t.src);
  if (!p) return;
  const q = (t.src.match(/\?v=\d+/) || [''])[0];
  const i = parseInt(t.dataset.fbk || '0', 10) + 1;
  if (i >= IMG_HOSTS.length) return;
  t.dataset.fbk = String(i);
  const base = IMG_HOSTS[i];
  t.src = base ? base + p + q : p + q;
}
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG') nextHost(t);
}, true);
// Watchdog: visible images still unloaded after 8s switch to next host
setInterval(() => {
  document.querySelectorAll('img[src*="jsdelivr.net"]').forEach(t => {
    if (t.complete && t.naturalWidth > 0) return;
    const r = t.getBoundingClientRect();
    if (r.top < innerHeight * 2 && r.bottom > -innerHeight) nextHost(t);
  });
}, 8000);

// Music
let musicPlayed = false;
// BGM source fallback: CDN first (fast in China), same-origin if it errors or stalls.
// Never swap once playback has started — switching src mid-play restarts the song (audible stutter).
(function () {
  const a = document.getElementById('bgm');
  let swapped = false;
  function toLocal() {
    if (swapped) return;
    // already playing: keep current source, mid-play swap causes an audible restart
    if (musicPlayed || !a.paused) return;
    swapped = true;
    a.src = 'bgm.mp3';
    a.load();
  }
  a.addEventListener('error', toLocal);
  const srcEl = a.querySelector('source');
  if (srcEl) srcEl.addEventListener('error', toLocal);
  // if not enough data to play within 12s of page load (and not yet playing), switch source
  setTimeout(() => { if (a.readyState < 3 && a.paused) toLocal(); }, 12000);
})();
function toggleMusic() {
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  if (audio.paused) {
    audio.play().catch(() => {});
    btn.classList.remove('paused');
  } else {
    audio.pause();
    btn.classList.add('paused');
  }
}
function autoPlay() {
  const audio = document.getElementById('bgm');
  if (!musicPlayed) {
    audio.play().then(() => { musicPlayed = true; }).catch(() => {});
  }
}
document.addEventListener('touchstart', autoPlay, { once: true });
document.addEventListener('click', autoPlay, { once: true });

// Petals
function createPetal() {
  const petal = document.createElement('div');
  petal.className = 'petal';
  petal.style.left = Math.random() * 100 + 'vw';
  petal.style.animationDuration = (Math.random() * 4 + 7) + 's';
  petal.style.opacity = Math.random() * 0.25 + 0.15;
  const scale = Math.random() * 0.4 + 0.6;
  petal.style.transform = `scale(${scale})`;
  document.getElementById('petals').appendChild(petal);
  setTimeout(() => petal.remove(), 12000);
}
setInterval(createPetal, 900);

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Countdown
function updateCountdown() {
  const weddingDate = new Date('2026-10-03T12:00:00');
  const now = new Date();
  const diff = weddingDate - now;
  if (diff > 0) {
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById('days').textContent = String(d).padStart(2, '0');
    document.getElementById('hours').textContent = String(h).padStart(2, '0');
    document.getElementById('minutes').textContent = String(m).padStart(2, '0');
    document.getElementById('seconds').textContent = String(s).padStart(2, '0');
  }
}
setInterval(updateCountdown, 1000);
updateCountdown();

document.title = '程谦&刘之壮的回门宴邀请';
</script>
